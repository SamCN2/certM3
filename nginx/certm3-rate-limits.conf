# Rate limiting zones for CertM3
# Include this file in the http block of your main nginx.conf

# API rate limiting (internal middleware-to-backend communication)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# App rate limiting (frontend-to-middleware communication)
limit_req_zone $binary_remote_addr zone=app:10m rate=20r/s;

# Admin rate limiting (admin interface)
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s; 