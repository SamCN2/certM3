# Certificate variable extraction maps for CertM3
# This file should be included in the http block of the main nginx configuration

# Extract Common Name from SSL client certificate DN
map $ssl_client_s_dn $ssl_client_cn {
    ~CN=([^,]+) $1;
    default "";
}

# Determine certificate state based on verification result
map $ssl_client_verify $cert_state {
    "SUCCESS" "valid";
    "FAILED" "invalid";
    default "none";
}

# Routing logic based on certificate state
map $cert_state $cert_redirect {
    "none" "/certm3/index.html";
    "invalid" "/certm3/error.html";
    "valid" "";
    default "/certm3/index.html";
} 
