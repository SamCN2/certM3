# This file configures the PostgREST server.
# It's set up to connect to the CertM3 database using a Unix socket,
# preserving the password-less database authentication method.

# Database connection string.
# It specifies the 'authenticator' user and the 'certm3' database.
# The host is omitted to force a Unix socket connection.
db-uri = "postgres://authenticator@/certm3"

# The database schema to expose as a RESTful API.
# We will create views and functions in this 'api' schema.
db-schemas = "api"

# Extra schemas to add to the search_path.
# This allows the views and functions in the 'api' schema to reference the
# base tables in the 'public' schema without exposing the tables directly.
db-extra-search-path = "public"

# The database role to use for unauthenticated requests.
db-anon-role = "anonymous"

# The secret for validating JSON Web Tokens (JWTs).
# This is a placeholder and MUST be replaced with a strong, secure secret
# in a real deployment environment. It must be at least 32 characters long.
jwt-secret = "placeholder-replace-this-with-a-real-secret-key-32-chars"
